<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="title">Diary entry</title>
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../../style.css">

</head>

<body class="diary">


    <h1 id="name" class="header_page to_center_width diary_text"></h1>
    <div id="entry" class="diary_entry diary_entry_open">
    
        <div id="header_entry"  class="entry_header" >
            <p id="p_name_of_entry"></p>
            <input id="name_of_entry" style="display: none;">
            <p id="date_of_entry"></p>
        </div>
        <div id="body_entry" class="entry_body_text">
            <!-- <textarea id="description_entry" class="description_entry_open"></textarea> -->
           <div id="p_description_entry"></div>
            <div id="editor" class="description_entry_open">
            </div>
            <div class="for_files">
                 <div id="photos" style="display: flex;">
                
                </div>

                <input type="file" id="file_add">
                <label for="file_add" class="label_file">Add file</label>

            </div>
           
            
        </div>
    </div>
    <div class="entry_buttons_div">
        <button class="btn diary_btn" id="back" onclick="location.href='..'">back</button>
        <button class="btn diary_btn" id="open_edit" onclick="open_edit()">edit entry</button>
        <button class="btn diary_btn" id="edit_entry" onclick="edit_entry()" style="display: none;">Save</button>

    </div>

    
    <script src="../../../moment.js"></script>
    <script src='entry.js'></script> 
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

    <script>for_existing()</script>            
    

<!-- Initialize Quill editor -->
<script>
  const quill = new Quill('#editor', {
    theme: 'snow'
  });
</script>
            
</body>

</html>
